name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional)"
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build-sniffers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Build static Googlevideo DNS sniffers
        env:
          ZIG: zig
          Z2R_GV_SNIFFER_MAX_BYTES: 163840
        run: |
          set -eu
          while read -r arch target; do
            Z2R_GV_SNIFFER_TARGET="$target" bash scripts/build-googlevideo-dns-sniffer.sh "assets/tools/bin/googlevideo-dns-sniffer-$arch"
          done <<'TARGETS'
          arm arm-linux-musleabihf
          arm64 aarch64-linux-musl
          mips mips-linux-musl
          mips64 mips64-linux-musl
          mipsle mipsel-linux-musl
          mips64le mips64el-linux-musl
          ppc64 powerpc64-linux-musl
          386 x86-linux-musl
          amd64 x86_64-linux-musl
          riscv64 riscv64-linux-musl
          TARGETS
      - name: Verify embedded sniffer install
        run: go test -mod=readonly ./internal/app -run '^TestInstallEmbeddedGooglevideoSniffer$'
      - uses: actions/upload-artifact@v4
        with:
          name: googlevideo-sniffers
          path: assets/tools/bin/googlevideo-dns-sniffer-*

  build:
    needs: [test, build-sniffers]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm
            goarm: "7"
            name: arm
          - goarch: arm64
            name: arm64
          - goarch: mips
            gomips: softfloat
            name: mips
          - goarch: mips64
            gomips: softfloat
            name: mips64
          - goarch: mipsle
            gomips: softfloat
            name: mipsel
          - goarch: mips64le
            gomips: softfloat
            name: mipsel64
          - goarch: ppc64
            name: ppc
          - goarch: "386"
            name: x86
          - goarch: amd64
            name: x86_64
          - goarch: riscv64
            name: riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/download-artifact@v4
        with:
          name: googlevideo-sniffers
          path: sniffer-assets
      - name: Select architecture sniffer
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p assets/tools/bin
          cp "sniffer-assets/googlevideo-dns-sniffer-${GOARCH}" assets/tools/bin/
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          ver="${RELEASE_TAG:-${GITHUB_REF_NAME:-dev}}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/AloofLibra/zator.versionOverride=${ver}" \
            -o "dist/zator-linux-${{ matrix.name }}" ./cmd/zator
          sha256sum "dist/zator-linux-${{ matrix.name }}" | tee "dist/zator-linux-${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: zator-linux-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Pack release files
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir -p out
          find artifacts -type f -name 'zator-linux-*' -exec cp {} out/ \;
          VER="${RELEASE_TAG:-$GITHUB_REF_NAME}" COMMIT="$GITHUB_SHA" bash scripts/pack-release.sh out
          cp scripts/zator-launcher.sh out/
          (cd out && sha256sum zator-linux-* zator-full.tar.gz latest.json zator-launcher.sh > SHA256SUMS)
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
