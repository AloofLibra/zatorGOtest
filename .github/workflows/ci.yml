name: ci

on:
  push:
    branches: [main, master, "feat/**", zatorGO]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Test
        run: go test -mod=mod ./...
      - name: Vet
        run: go vet -mod=mod ./...
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Build sample arches
        env:
          ZIG: zig
          Z2R_GV_SNIFFER_MAX_BYTES: 163840
          Z2R_GV_SNIFFER_TARGET: aarch64-linux-musl
        run: |
          bash scripts/build-googlevideo-dns-sniffer.sh assets/tools/bin/googlevideo-dns-sniffer-arm64
          file assets/tools/bin/googlevideo-dns-sniffer-arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=mod -o /tmp/zator-amd64 ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=mod -o /tmp/zator-arm64 ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -mod=mod -o /tmp/zator-mipsel ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build -mod=mod -o /tmp/zator-riscv64 ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -mod=mod -o /tmp/zator-arm ./cmd/zator

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui-src/package-lock.json
      - name: Install webui deps
        working-directory: webui-src
        run: npm ci
      - name: Typecheck
        working-directory: webui-src
        run: npm run check
      - name: Build
        working-directory: webui-src
        run: npm run build
      - name: Embedded assets match build
        run: git diff --exit-code -- assets/webui
