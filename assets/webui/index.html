<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZatorGO</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=f66c0a59">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem('zatorgo-theme') || localStorage.getItem('z2r-theme');
      if (t === 'light' || t === 'dark' || t === 'auto') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
    <link rel="stylesheet" href="styles.css?v=5432efca">
</head>
<body>
  <div id="app"></div>
  <script src="app.js?v=e8d32b26"></script>
</body>
</html>
